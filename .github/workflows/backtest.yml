name: Run Backtest (Live OKX Data)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: '2024-09-01'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: false
        default: '2025-03-01'

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/claude-code-cloud-github-hokzc8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ccxt pandas numpy

      - name: Patch dates from inputs
        run: |
          sed -i "s/START_DATE = .*/START_DATE = '${{ github.event.inputs.start_date }}'/" backtest.py
          sed -i "s/END_DATE   = .*/END_DATE   = '${{ github.event.inputs.end_date }}'/" backtest.py

      - name: Run backtest
        run: python3 backtest.py 2>&1 | tee results/backtest_result.txt

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/backtest_result.txt
          git diff --cached --quiet || git commit -m "backtest result: $(date -u '+%Y-%m-%d %H:%M UTC') [live OKX data]"
          git push
