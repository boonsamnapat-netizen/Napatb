name: "DC55v24 — OKX Dry-Run Bot"

# รันทุก 4 ชั่วโมงตรงกับ 4H candle close (UTC: 00,04,08,12,16,20)
# +5 นาทีเผื่อ candle ปิดและ OKX ส่งข้อมูล
# v2: informative_pairs() fix + column name detection (2026-06-12)
on:
  schedule:
    - cron: '5 0,8,16 * * *'
  workflow_dispatch:

jobs:
  dryrun:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/claude-code-cloud-github-hokzc8

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Freqtrade
        run: pip install "freqtrade<2026.5" --quiet

      - name: Patch CCXT keysort (OKX returns None market IDs)
        run: |
          python3 << 'PYEOF'
          import site, os
          search = site.getsitepackages() + [site.getusersitepackages()]
          for sp in search:
              p = os.path.join(sp, 'ccxt/base/exchange.py')
              if not os.path.exists(p):
                  continue
              txt = open(p).read()
              old = 'return dict(sorted(dictionary.items()))'
              new = 'return dict(sorted({k: v for k, v in dictionary.items() if k is not None}.items()))'
              if old in txt:
                  open(p, 'w').write(txt.replace(old, new, 1))
                  print('Patched:', p)
              else:
                  print('Already patched or not found:', p)
              break
          PYEOF

      - name: Create Freqtrade userdir
        run: freqtrade create-userdir --userdir freqtrade/user_data

      - name: Restore trade database (state ก่อนหน้า)
        run: |
          if [ -f dryrun/tradesv3.sqlite ]; then
            echo "Restoring existing trade database..."
            cp dryrun/tradesv3.sqlite freqtrade/user_data/tradesv3.sqlite
          else
            echo "First run — starting fresh database"
          fi

      - name: Build live config from GitHub Secrets
        env:
          OKX_KEY:    ${{ secrets.OKX_API_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASS:   ${{ secrets.OKX_PASSPHRASE }}
          TG_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'PYEOF'
          import json, os, sys
          key  = os.environ.get('OKX_KEY', '')
          sec  = os.environ.get('OKX_SECRET', '')
          pwd  = os.environ.get('OKX_PASS', '')
          if not (key and sec and pwd):
              print("ERROR: OKX_API_KEY / OKX_SECRET_KEY / OKX_PASSPHRASE secrets not set.")
              print("Add them in: GitHub repo → Settings → Secrets → Actions")
              sys.exit(1)
          cfg = json.load(open('freqtrade/config_okx.json'))
          cfg['exchange']['key']      = key
          cfg['exchange']['secret']   = sec
          cfg['exchange']['password'] = pwd
          cfg['strategy']                  = 'DC55v35'
          cfg['bot_name']                  = 'DC55v35-DryRun'
          cfg['dry_run']                   = True
          cfg['dry_run_wallet']            = 10000
          cfg['process_only_new_candles']  = False
          # 20 pairs = top 10 liquid + top 10 backtest performers (ตาม holdout 2025-03-01→06-01)
          # (20 pairs × 3 tf × 3 pages × 5 sec/req ≈ 900 sec startup → เหลือ ~10 min trading)
          cfg['exchange']['pair_whitelist'] = [
              "BTC/USDT:USDT", "ETH/USDT:USDT", "SOL/USDT:USDT", "BNB/USDT:USDT",
              "XRP/USDT:USDT", "DOGE/USDT:USDT", "ADA/USDT:USDT", "LINK/USDT:USDT",
              "DOT/USDT:USDT", "AVAX/USDT:USDT",
              "AXS/USDT:USDT", "LDO/USDT:USDT", "APE/USDT:USDT", "GRT/USDT:USDT",
              "TRX/USDT:USDT", "1INCH/USDT:USDT", "MANA/USDT:USDT", "SAND/USDT:USDT",
              "BCH/USDT:USDT", "PEPE/USDT:USDT",
          ]
          cfg['exchange']['pair_blacklist'] = []
          # บังคับ db path ให้ตรงกับ restore/save step (dry-run default คือ tradesv3.dryrun.sqlite)
          cfg['db_url'] = 'sqlite:///freqtrade/user_data/tradesv3.sqlite'
          tg_token = os.environ.get('TG_TOKEN', '')
          tg_chat  = os.environ.get('TG_CHAT', '')
          if tg_token and tg_chat:
              cfg['telegram']['enabled']  = True
              cfg['telegram']['token']    = tg_token
              cfg['telegram']['chat_id']  = tg_chat
              print("Telegram notifications: ENABLED")
          else:
              cfg['telegram']['enabled'] = False
              print("Telegram notifications: disabled (secrets not set)")
          json.dump(cfg, open('/tmp/config_live.json', 'w'), indent=2)
          print("Live config written OK")
          PYEOF

      - name: Run dry-run bot (15 นาที)
        run: |
          timeout 1500 freqtrade trade \
            --config /tmp/config_live.json \
            --userdir freqtrade/user_data \
            --strategy DC55v35 \
            --strategy-path freqtrade/strategies/ \
            2>&1 | tee /tmp/dryrun_full.log || true
          echo "=== Last 300 lines ==="
          tail -300 /tmp/dryrun_full.log

      - name: Generate status report
        run: |
          python3 - << 'PYEOF'
          import sqlite3, os, traceback
          from datetime import datetime, timezone

          db = 'freqtrade/user_data/tradesv3.sqlite'
          os.makedirs('dryrun', exist_ok=True)
          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')

          try:
              if not os.path.exists(db):
                  with open('dryrun/status.md', 'w') as f:
                      f.write(f"# DC55v24 Dry-Run\n\n*{now}*\n\nBot ยังไม่ได้เริ่ม หรือ database ยังไม่สร้าง\n")
                  exit(0)

              conn = sqlite3.connect(db)
              cur  = conn.cursor()

              # Debug: แสดง schema จริงของตาราง trades
              cur.execute("PRAGMA table_info(trades)")
              rows = cur.fetchall()
              cols = {row[1] for row in rows}
              print(f"DEBUG: trades columns = {sorted(cols)}")

              # หา column absolute P&L (ใหม่=close_profit_abs, เก่า=profit_abs)
              pabs = None
              for candidate in ('close_profit_abs', 'profit_absolute', 'profit_abs', 'profit'):
                  if candidate in cols:
                      pabs = candidate
                      break
              # หา column ratio P&L (ใหม่=close_profit, เก่า=profit_ratio)
              prat = None
              for candidate in ('close_profit', 'profit_ratio', 'profit_factor'):
                  if candidate in cols:
                      prat = candidate
                      break
              print(f"DEBUG: pabs={pabs!r}  prat={prat!r}")

              pabs_expr = pabs if pabs else 'NULL'
              prat_expr = prat if prat else 'NULL'

              cur.execute(f"SELECT COUNT(*), COALESCE(SUM({pabs_expr}),0) FROM trades WHERE is_open=0")
              total_closed, total_pnl = cur.fetchone()

              cur.execute("""
                  SELECT pair, open_date, open_rate, stake_amount, is_short
                  FROM trades WHERE is_open=1 ORDER BY open_date
              """)
              open_trades = cur.fetchall()

              cur.execute(f"""
                  SELECT pair, open_date, close_date, open_rate, close_rate,
                         {prat_expr}, {pabs_expr}, exit_reason, is_short
                  FROM trades WHERE is_open=0 ORDER BY close_date DESC LIMIT 20
              """)
              closed = cur.fetchall()
              conn.close()

              win = sum(1 for r in closed if r[6] and r[6] > 0)
              wr  = f"{win/len(closed)*100:.1f}%" if closed else "—"

              lines = [
                  f"# DC55v24 Dry-Run Status",
                  f"",
                  f"**อัปเดต:** {now}",
                  f"",
                  f"## ภาพรวม",
                  f"| ตัวชี้วัด | ค่า |",
                  f"|---|---|",
                  f"| Closed trades | {total_closed} |",
                  f"| Total P&L | {total_pnl:+.2f} USDT |",
                  f"| Win Rate (recent) | {wr} |",
                  f"| Open positions | {len(open_trades)} / 6 |",
                  f"",
                  f"## Open Positions ({len(open_trades)})",
              ]

              if open_trades:
                  lines += [
                      "| Pair | Side | Opened | Entry Price |",
                      "|------|------|--------|-------------|",
                  ]
                  for pair, odate, orate, stake, is_short in open_trades:
                      side = "SHORT" if is_short else "LONG"
                      lines.append(f"| {pair} | {side} | {str(odate)[:16]} | {orate:.6f} |")
              else:
                  lines.append("*ไม่มี open position*")

              lines += ["", "## Closed Trades ล่าสุด (20 รายการ)"]
              if closed:
                  lines += [
                      "| Pair | Side | P&L% | P&L USDT | Exit |",
                      "|------|------|------|----------|------|",
                  ]
                  for pair, odate, cdate, orate, crate, pct, pnl, reason, is_short in closed:
                      side = "SHORT" if is_short else "LONG"
                      pct_s = f"{pct*100:+.2f}%" if pct is not None else "—"
                      pnl_s = f"{pnl:+.2f}" if pnl is not None else "—"
                      lines.append(f"| {pair} | {side} | {pct_s} | {pnl_s} | {reason} |")
              else:
                  lines.append("*ยังไม่มี closed trade*")

              with open('dryrun/status.md', 'w') as f:
                  f.write('\n'.join(lines) + '\n')
              print("Status report written to dryrun/status.md")

          except Exception as e:
              print(f"ERROR generating status: {e}")
              traceback.print_exc()
              with open('dryrun/status.md', 'w') as f:
                  f.write(f"# DC55v24 Dry-Run\n\n*{now}*\n\nError: {e}\n")
          PYEOF

      - name: Save state and commit
        if: always()
        run: |
          echo "=== SQLite files found (all locations) ==="
          find . -name "*.sqlite" -ls 2>/dev/null || echo "No sqlite files found anywhere"
          mkdir -p dryrun
          # ลอง copy ทั้ง tradesv3.sqlite และ tradesv3.dryrun.sqlite
          if [ -f freqtrade/user_data/tradesv3.sqlite ]; then
            cp freqtrade/user_data/tradesv3.sqlite dryrun/tradesv3.sqlite
            echo "Saved tradesv3.sqlite"
          elif [ -f freqtrade/user_data/tradesv3.dryrun.sqlite ]; then
            cp freqtrade/user_data/tradesv3.dryrun.sqlite dryrun/tradesv3.sqlite
            echo "Saved tradesv3.dryrun.sqlite → tradesv3.sqlite"
          elif [ -f tradesv3.sqlite ]; then
            cp tradesv3.sqlite dryrun/tradesv3.sqlite
            echo "Saved tradesv3.sqlite from CWD"
          elif [ -f tradesv3.dryrun.sqlite ]; then
            cp tradesv3.dryrun.sqlite dryrun/tradesv3.sqlite
            echo "Saved tradesv3.dryrun.sqlite from CWD"
          else
            echo "WARNING: No SQLite database found!"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # บันทึกไฟล์ที่ generate ไว้ก่อน แล้ว sync remote เพื่อหลีกเลี่ยง conflict
          mkdir -p /tmp/dryrun_save
          cp dryrun/status.md /tmp/dryrun_save/status.md 2>/dev/null || true
          cp dryrun/tradesv3.sqlite /tmp/dryrun_save/tradesv3.sqlite 2>/dev/null || true
          # Sync latest remote (ป้องกัน binary conflict เมื่อ run พร้อมกัน)
          git fetch origin claude/claude-code-cloud-github-hokzc8
          git reset --hard origin/claude/claude-code-cloud-github-hokzc8
          mkdir -p dryrun
          cp /tmp/dryrun_save/status.md dryrun/status.md 2>/dev/null || true
          cp /tmp/dryrun_save/tradesv3.sqlite dryrun/tradesv3.sqlite 2>/dev/null || true
          git add dryrun/tradesv3.sqlite 2>/dev/null || true
          git add dryrun/status.md 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "Dry-run $(date -u '+%Y-%m-%d %H:%M UTC') — $(python3 -c "
          import sqlite3, os
          db='freqtrade/user_data/tradesv3.sqlite'
          if os.path.exists(db):
              c=sqlite3.connect(db).cursor()
              c.execute('SELECT COUNT(*) FROM trades WHERE is_open=1')
              n=c.fetchone()[0]
              print(f'{n} open positions')
          else:
              print('no db')
          ")"
          git push origin HEAD:claude/claude-code-cloud-github-hokzc8
