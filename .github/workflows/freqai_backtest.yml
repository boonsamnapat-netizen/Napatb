name: Backtest — Fibo Long+Short (Phase F.13 DD Reduction)

on:
  workflow_dispatch:
    inputs:
      timerange:
        description: 'In-sample timerange'
        required: false
        default: '20230301-20250301'
      run_oos:
        description: 'Also run OOS 2021-2023?'
        required: false
        default: 'true'

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/claude-code-cloud-github-hokzc8

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Freqtrade
        run: |
          pip install "freqtrade<2026.5" --quiet

      - name: Patch CCXT keysort (OKX returns None market IDs)
        run: |
          python3 << 'PYEOF'
          import site, os
          search = site.getsitepackages() + [site.getusersitepackages()]
          for sp in search:
              p = os.path.join(sp, 'ccxt/base/exchange.py')
              if not os.path.exists(p):
                  continue
              txt = open(p).read()
              old = 'return dict(sorted(dictionary.items()))'
              new = 'return dict(sorted({k: v for k, v in dictionary.items() if k is not None}.items()))'
              if old in txt:
                  open(p, 'w').write(txt.replace(old, new, 1))
                  print('Patched:', p)
              else:
                  print('Already patched or pattern not found:', p)
              break
          PYEOF

      - name: Create Freqtrade user directory
        run: |
          freqtrade create-userdir --userdir freqtrade/user_data

      - name: Cache OHLCV data
        id: cache-ohlcv
        uses: actions/cache@v4
        with:
          path: freqtrade/user_data/data/okx
          key: okx-ohlcv-btc-eth-sol-20200101-20250601-v1

      - name: Download historical data (OKX, fallback to Binance)
        if: steps.cache-ohlcv.outputs.cache-hit != 'true'
        run: |
          mkdir -p freqtrade/user_data/data/okx
          echo "Trying OKX..."
          freqtrade download-data \
            --config freqtrade/config_okx.json \
            --userdir freqtrade/user_data \
            --timerange 20200101-20250601 \
            --timeframes 1h 4h 1d \
            --data-format-ohlcv json \
            --pairs "BTC/USDT:USDT" "ETH/USDT:USDT" "SOL/USDT:USDT" \
          || { echo "OKX download failed — falling back to Binance..." && \
               python3 -c "import json; cfg=json.load(open('freqtrade/config_okx.json')); cfg['exchange']['name']='binance'; json.dump(cfg,open('/tmp/cfg_binance_dl.json','w'))" && \
               freqtrade download-data \
                 --config /tmp/cfg_binance_dl.json \
                 --datadir freqtrade/user_data/data/okx \
                 --timerange 20200101-20250601 \
                 --timeframes 1h 4h 1d \
                 --data-format-ohlcv json \
                 --pairs "BTC/USDT:USDT" "ETH/USDT:USDT" "SOL/USDT:USDT"; }

      - name: Run in-sample backtest (2023-2025)
        run: |
          mkdir -p results
          freqtrade backtesting \
            --config freqtrade/config_okx.json \
            --userdir freqtrade/user_data \
            --strategy-list FiboSC14w14sp15 FiboF13be FiboF13r75 FiboF13full \
            --strategy-path freqtrade/strategies/ \
            --timerange ${{ github.event.inputs.timerange }} \
            2>&1 | tee results/fibo_insample.txt

      - name: Run OOS1 backtest — 2021-2023 (bear market)
        if: ${{ github.event.inputs.run_oos == 'true' }}
        run: |
          freqtrade backtesting \
            --config freqtrade/config_okx.json \
            --userdir freqtrade/user_data \
            --strategy-list FiboSC14w14sp15 FiboF13be FiboF13r75 FiboF13full \
            --strategy-path freqtrade/strategies/ \
            --timerange 20210101-20230101 \
            2>&1 | tee results/fibo_oos.txt

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/fibo_insample.txt results/fibo_oos.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "F.13 dd-reduction backtest: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
