name: Backtest (Fibo Retrace + OKX)

on:
  workflow_dispatch:
    inputs:
      timerange:
        description: 'Backtest timerange (in-sample 20230301-20250301, OOS 20210101-20230101)'
        required: false
        default: '20230301-20250301'

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/claude-code-cloud-github-hokzc8

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Freqtrade
        run: |
          pip install "freqtrade<2026.5" --quiet

      - name: Create Freqtrade user directory
        run: |
          freqtrade create-userdir --userdir freqtrade/user_data

      - name: Download OKX historical data (1h + 4h)
        run: |
          freqtrade download-data \
            --config freqtrade/config_okx.json \
            --userdir freqtrade/user_data \
            --timerange 20200101-20250601 \
            --timeframes 1h 4h 1d \
            --data-format-ohlcv json \
            --pairs BTC/USDT ETH/USDT

      - name: Run backtest (4 Fibo variants)
        run: |
          mkdir -p results
          freqtrade backtesting \
            --config freqtrade/config_okx.json \
            --userdir freqtrade/user_data \
            --strategy-list FiboRecentConfirm FiboRecentTouch FiboTrendConfirm FiboTrendTouch \
            --strategy-path freqtrade/strategies/ \
            --timerange ${{ github.event.inputs.timerange }} \
            2>&1 | tee results/freqai_backtest_result.txt

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/freqai_backtest_result.txt
          git diff --cached --quiet || git commit -m "backtest result: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
