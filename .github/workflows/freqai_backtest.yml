name: "Backtest C.14 - DC55v15 vs v18 production decision + asymmetric RSI 73 pairs"

on:
  push:
    branches:
      - claude/claude-code-cloud-github-hokzc8
    paths:
      - 'freqtrade/strategies/**.py'
      - 'freqtrade/config_okx.json'
      - '.github/workflows/freqai_backtest.yml'
  workflow_dispatch:
    inputs:
      timerange:
        description: 'In-sample timerange'
        required: false
        default: '20200101-20250301'
      run_oos:
        description: 'Also run OOS 2021-2023?'
        required: false
        default: 'true'

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/claude-code-cloud-github-hokzc8

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Freqtrade
        run: |
          pip install "freqtrade<2026.5" --quiet

      - name: Patch CCXT keysort (OKX returns None market IDs)
        run: |
          python3 << 'PYEOF'
          import site, os
          search = site.getsitepackages() + [site.getusersitepackages()]
          for sp in search:
              p = os.path.join(sp, 'ccxt/base/exchange.py')
              if not os.path.exists(p):
                  continue
              txt = open(p).read()
              old = 'return dict(sorted(dictionary.items()))'
              new = 'return dict(sorted({k: v for k, v in dictionary.items() if k is not None}.items()))'
              if old in txt:
                  open(p, 'w').write(txt.replace(old, new, 1))
                  print('Patched:', p)
              else:
                  print('Already patched or pattern not found:', p)
              break
          PYEOF

      - name: Create Freqtrade user directory
        run: |
          freqtrade create-userdir --userdir freqtrade/user_data

      - name: Cache OHLCV data
        id: cache-ohlcv
        uses: actions/cache@v4
        with:
          path: freqtrade/user_data/data/okx
          key: okx-ohlcv-universe73-20200101-20250601-v1

      - name: Download historical data (OKX, fallback to Binance)
        if: steps.cache-ohlcv.outputs.cache-hit != 'true'
        run: |
          mkdir -p freqtrade/user_data/data/okx
          echo "Trying OKX..."
          freqtrade download-data \
            --config freqtrade/config_okx.json \
            --userdir freqtrade/user_data \
            --timerange 20200101-20250601 \
            --timeframes 1h 4h 1d 1w \
            --data-format-ohlcv json \
            --pairs "BTC/USDT:USDT" "ETH/USDT:USDT" "BNB/USDT:USDT" "SOL/USDT:USDT" "XRP/USDT:USDT" "DOGE/USDT:USDT" "ADA/USDT:USDT" "MATIC/USDT:USDT" "LINK/USDT:USDT" "DOT/USDT:USDT" "AVAX/USDT:USDT" "LTC/USDT:USDT" "BCH/USDT:USDT" "UNI/USDT:USDT" "ATOM/USDT:USDT" "ETC/USDT:USDT" "FIL/USDT:USDT" "TRX/USDT:USDT" "EOS/USDT:USDT" "XLM/USDT:USDT" "ALGO/USDT:USDT" "AAVE/USDT:USDT" "CRV/USDT:USDT" "SAND/USDT:USDT" "MANA/USDT:USDT" "SUSHI/USDT:USDT" "NEAR/USDT:USDT" "FTM/USDT:USDT" "AXS/USDT:USDT" "SNX/USDT:USDT" "COMP/USDT:USDT" "RUNE/USDT:USDT" "GRT/USDT:USDT" "1INCH/USDT:USDT" "THETA/USDT:USDT" "VET/USDT:USDT" "CHZ/USDT:USDT" "ENJ/USDT:USDT" "GALA/USDT:USDT" "STX/USDT:USDT" "ROSE/USDT:USDT" "KSM/USDT:USDT" "ZEC/USDT:USDT" "WAVES/USDT:USDT" "OMG/USDT:USDT" "DYDX/USDT:USDT" "LDO/USDT:USDT" "IMX/USDT:USDT" "APE/USDT:USDT" "FLOW/USDT:USDT" "AR/USDT:USDT" "ICP/USDT:USDT" "ANKR/USDT:USDT" "ZRX/USDT:USDT" "LRC/USDT:USDT" "ONE/USDT:USDT" "KAVA/USDT:USDT" "YFI/USDT:USDT" "BAT/USDT:USDT" "OP/USDT:USDT" "FET/USDT:USDT" "RNDR/USDT:USDT" "TAO/USDT:USDT" "INJ/USDT:USDT" "WLD/USDT:USDT" "PEPE/USDT:USDT" "WIF/USDT:USDT" "BONK/USDT:USDT" "SHIB/USDT:USDT" "SUI/USDT:USDT" "APT/USDT:USDT" "SEI/USDT:USDT" "TIA/USDT:USDT" \
          || { echo "OKX download failed — falling back to Binance..." && \
               python3 -c "import json; cfg=json.load(open('freqtrade/config_okx.json')); cfg['exchange']['name']='binance'; json.dump(cfg,open('/tmp/cfg_binance_dl.json','w'))" && \
               freqtrade download-data \
                 --config /tmp/cfg_binance_dl.json \
                 --datadir freqtrade/user_data/data/okx \
                 --timerange 20200101-20250601 \
                 --timeframes 1h 4h 1d 1w \
                 --data-format-ohlcv json \
                 --pairs "BTC/USDT:USDT" "ETH/USDT:USDT" "BNB/USDT:USDT" "SOL/USDT:USDT" "XRP/USDT:USDT" "DOGE/USDT:USDT" "ADA/USDT:USDT" "MATIC/USDT:USDT" "LINK/USDT:USDT" "DOT/USDT:USDT" "AVAX/USDT:USDT" "LTC/USDT:USDT" "BCH/USDT:USDT" "UNI/USDT:USDT" "ATOM/USDT:USDT" "ETC/USDT:USDT" "FIL/USDT:USDT" "TRX/USDT:USDT" "EOS/USDT:USDT" "XLM/USDT:USDT" "ALGO/USDT:USDT" "AAVE/USDT:USDT" "CRV/USDT:USDT" "SAND/USDT:USDT" "MANA/USDT:USDT" "SUSHI/USDT:USDT" "NEAR/USDT:USDT" "FTM/USDT:USDT" "AXS/USDT:USDT" "SNX/USDT:USDT" "COMP/USDT:USDT" "RUNE/USDT:USDT" "GRT/USDT:USDT" "1INCH/USDT:USDT" "THETA/USDT:USDT" "VET/USDT:USDT" "CHZ/USDT:USDT" "ENJ/USDT:USDT" "GALA/USDT:USDT" "STX/USDT:USDT" "ROSE/USDT:USDT" "KSM/USDT:USDT" "ZEC/USDT:USDT" "WAVES/USDT:USDT" "OMG/USDT:USDT" "DYDX/USDT:USDT" "LDO/USDT:USDT" "IMX/USDT:USDT" "APE/USDT:USDT" "FLOW/USDT:USDT" "AR/USDT:USDT" "ICP/USDT:USDT" "ANKR/USDT:USDT" "ZRX/USDT:USDT" "LRC/USDT:USDT" "ONE/USDT:USDT" "KAVA/USDT:USDT" "YFI/USDT:USDT" "BAT/USDT:USDT" "OP/USDT:USDT"; }

      - name: Run in-sample backtest — 5yr 2020-2025
        run: |
          mkdir -p results
          freqtrade backtesting \
            --config freqtrade/config_okx.json \
            --userdir freqtrade/user_data \
            --strategy-list DC55v9 DC55v15 DC55v18 DC55v20 \
            --strategy-path freqtrade/strategies/ \
            --timerange ${{ github.event.inputs.timerange || '20200101-20250301' }} \
            2>&1 | tee results/c14_insample.txt

      - name: Run OOS backtest — 2021-2023 (bear market reference)
        if: ${{ github.event.inputs.run_oos != 'false' }}
        run: |
          freqtrade backtesting \
            --config freqtrade/config_okx.json \
            --userdir freqtrade/user_data \
            --strategy-list DC55v9 DC55v15 DC55v18 DC55v20 \
            --strategy-path freqtrade/strategies/ \
            --timerange 20210101-20230101 \
            2>&1 | tee results/c14_oos.txt

      - name: Run holdout backtest — 2025-03 to 2025-06 (untouched)
        run: |
          freqtrade backtesting \
            --config freqtrade/config_okx.json \
            --userdir freqtrade/user_data \
            --strategy-list DC55v9 DC55v15 DC55v18 DC55v20 \
            --strategy-path freqtrade/strategies/ \
            --timerange 20250301-20250601 \
            2>&1 | tee results/c14_holdout.txt

      - name: Commit results
        run: |
          for f in results/c14_insample.txt results/c14_oos.txt; do
            [ -f "$f" ] && tail -1000 "$f" > /tmp/_t.txt && mv /tmp/_t.txt "$f"
          done
          [ -f results/c14_holdout.txt ] && tail -500 results/c14_holdout.txt > /tmp/_t.txt && mv /tmp/_t.txt results/c14_holdout.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/c14_insample.txt results/c14_oos.txt results/c14_holdout.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "C.14 DC55v15 vs v18 production decision backtest: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
