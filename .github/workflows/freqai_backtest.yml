name: Backtest — Fibo Long+Short (Phase F.12 Split TP)

on:
  workflow_dispatch:
    inputs:
      timerange:
        description: 'In-sample timerange'
        required: false
        default: '20230301-20250301'
      run_oos:
        description: 'Also run OOS 2021-2023?'
        required: false
        default: 'true'

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/claude-code-cloud-github-hokzc8

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Freqtrade
        run: |
          pip install "freqtrade<2026.5" --quiet

      - name: Create Freqtrade user directory
        run: |
          freqtrade create-userdir --userdir freqtrade/user_data

      - name: Download OKX historical data
        run: |
          freqtrade download-data \
            --config freqtrade/config_okx.json \
            --userdir freqtrade/user_data \
            --timerange 20200101-20250601 \
            --timeframes 1h 4h 1d \
            --data-format-ohlcv json \
            --pairs "BTC/USDT:USDT" "ETH/USDT:USDT" "SOL/USDT:USDT"

      - name: Run in-sample backtest (2023-2025)
        run: |
          mkdir -p results
          freqtrade backtesting \
            --config freqtrade/config_okx.json \
            --userdir freqtrade/user_data \
            --strategy-list FiboSC14w14 FiboSC14w14v15 FiboSC14w14sp FiboSC14w14sp15 \
            --strategy-path freqtrade/strategies/ \
            --timerange ${{ github.event.inputs.timerange }} \
            2>&1 | tee results/fibo_insample.txt

      - name: Run OOS1 backtest — 2021-2023 (bear market)
        if: ${{ github.event.inputs.run_oos == 'true' }}
        run: |
          freqtrade backtesting \
            --config freqtrade/config_okx.json \
            --userdir freqtrade/user_data \
            --strategy-list FiboSC14w14 FiboSC14w14v15 FiboSC14w14sp FiboSC14w14sp15 \
            --strategy-path freqtrade/strategies/ \
            --timerange 20210101-20230101 \
            2>&1 | tee results/fibo_oos.txt

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/fibo_insample.txt results/fibo_oos.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "F.12 split-TP backtest: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
